# Sert l'export statique Next (`out/`) : aucun runtime Node côté web.
server {
    listen 3002;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Redirections relatives : derrière Traefik, l'hôte public n'est pas celui du conteneur.
    absolute_redirect off;
    port_in_redirect off;

    # QR imprimés avant le passage en export statique : /p/<code> → /p/?c=<code>
    location ~ ^/p/(?<public_code>[A-Za-z0-9_-]+)/?$ {
        set $legacy_query "c=$public_code";
        if ($args) {
            set $legacy_query "c=$public_code&$args";
        }
        return 302 /p/?$legacy_query;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;
}
