version: 2
updates:
    - package-ecosystem: npm
      directory: /
      schedule:
          interval: weekly
          day: monday
          time: '06:00'
          timezone: Europe/Paris
      open-pull-requests-limit: 8
      commit-message:
          prefix: chore
          include: scope
      groups:
          react:
              patterns: ['react', 'react-dom', '@types/react', '@types/react-dom']
          next:
              patterns: ['next', '@next/*', 'eslint-config-next']
          tailwind:
              patterns: ['tailwindcss', '@tailwindcss/*', 'prettier-plugin-tailwindcss']
          opentelemetry:
              patterns: ['@opentelemetry/*']
          sentry:
              patterns: ['@sentry/*']
          linting:
              patterns: ['eslint*', '@typescript-eslint/*', 'typescript-eslint', 'stylelint*', 'prettier']
          types:
              patterns: ['@types/*']

    - package-ecosystem: cargo
      directory: /apps/mobile/src-tauri
      schedule:
          interval: weekly
          day: monday
          time: '06:00'
          timezone: Europe/Paris
      commit-message:
          prefix: chore
          include: scope
      groups:
          tauri:
              patterns: ['tauri*']

    - package-ecosystem: docker
      directories:
          - /apps/site
          - /apps/client
          - /apps/admin
          - /apps/mobile
      schedule:
          interval: weekly
          day: monday
          time: '06:00'
          timezone: Europe/Paris
      commit-message:
          prefix: chore
          include: scope

    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
          day: monday
          time: '06:00'
          timezone: Europe/Paris
      commit-message:
          prefix: chore
          include: scope
      groups:
          actions:
              patterns: ['*']
