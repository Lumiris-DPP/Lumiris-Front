name: CI

on:
    push:
        branches: [main]
    pull_request:
        # `labeled` is not a default type; without it, adding the `mobile` label
        # would never start the Tauri job it is meant to opt into.
        types: [opened, synchronize, reopened, labeled]

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

env:
    BUN_VERSION: '1.3.14'
    NEXT_TELEMETRY_DISABLED: '1'

jobs:
    quality:
        name: Lint · Typecheck · Test
        runs-on: ubuntu-latest
        timeout-minutes: 25
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
              with:
                  bun-version: ${{ env.BUN_VERSION }}

            - name: Cache the Bun install store
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ~/.bun/install/cache
                  key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
                  restore-keys: bun-${{ runner.os }}-

            - name: Cache Turbo artefacts
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: .turbo/cache
                  key: turbo-quality-${{ runner.os }}-${{ github.sha }}
                  restore-keys: turbo-quality-${{ runner.os }}-

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Lint (JS/TS)
              run: bun run lint

            - name: Lint (CSS)
              run: bun run lint:css

            - name: Format check
              run: bun run format:check

            - name: Typecheck
              run: bun run typecheck

            - name: Topology — no cross-app dependency
              run: bun run topo

            - name: Dependency versions in lockstep
              run: bun run check:deps

            - name: Test
              run: bun run test

            - name: Knip — dead code, unresolved imports & unused dependencies
              run: bun run knip

    build:
        name: Build all apps
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
              with:
                  bun-version: ${{ env.BUN_VERSION }}

            - name: Cache the Bun install store
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ~/.bun/install/cache
                  key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
                  restore-keys: bun-${{ runner.os }}-

            - name: Cache Turbo artefacts
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: .turbo/cache
                  key: turbo-build-${{ runner.os }}-${{ github.sha }}
                  restore-keys: turbo-build-${{ runner.os }}-

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Build
              run: bun run build

    images:
        name: Image · ${{ matrix.app }}
        runs-on: ubuntu-latest
        timeout-minutes: 30
        permissions:
            contents: read
            security-events: write
        strategy:
            fail-fast: false
            matrix:
                include:
                    - app: site
                      image: lumiris-site
                    - app: client
                      image: lumiris-app
                    - app: admin
                      image: lumiris-admin
                    - app: mobile
                      image: lumiris-mobile
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: hadolint
              uses: hadolint/hadolint-action@2a66e89f53d0771bb131a7fa31f3136336094aa6 # v3.4.0
              with:
                  dockerfile: apps/${{ matrix.app }}/Dockerfile
                  failure-threshold: warning

            - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

            - name: Build the image (no push)
              uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
              with:
                  context: .
                  file: apps/${{ matrix.app }}/Dockerfile
                  push: false
                  load: true
                  tags: ${{ matrix.image }}:ci
                  cache-from: type=gha,scope=${{ matrix.app }}
                  cache-to: type=gha,mode=max,scope=${{ matrix.app }}

            - name: Trivy — image vulnerabilities
              uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
              with:
                  image-ref: ${{ matrix.image }}:ci
                  format: sarif
                  output: trivy-${{ matrix.app }}.sarif
                  severity: CRITICAL,HIGH
                  ignore-unfixed: true

            - name: Upload the Trivy SARIF report
              if: ${{ github.event.repository.visibility == 'public' }}
              uses: github/codeql-action/upload-sarif@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4
              with:
                  sarif_file: trivy-${{ matrix.app }}.sarif
                  category: trivy-${{ matrix.app }}

            # Gate on application dependencies only. Base-image OS packages are
            # reported above but cannot be fixed from this repo — they clear when
            # the upstream image is rebuilt, which Dependabot proposes.
            - name: Fail on fixable CRITICAL vulnerabilities in app dependencies
              uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
              with:
                  image-ref: ${{ matrix.image }}:ci
                  format: table
                  severity: CRITICAL
                  vuln-type: library
                  ignore-unfixed: true
                  exit-code: '1'

    lighthouse:
        name: Lighthouse CI
        runs-on: ubuntu-latest
        timeout-minutes: 25
        needs: build
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
              with:
                  bun-version: ${{ env.BUN_VERSION }}

            - name: Cache the Bun install store
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ~/.bun/install/cache
                  key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
                  restore-keys: bun-${{ runner.os }}-

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Build the public site
              run: bun run --filter @lumiris/site build

            - name: Lighthouse budgets
              run: bun run lhci
              env:
                  LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

    tauri:
        name: Mobile · Tauri (${{ matrix.os }})
        # Slowest job of the pipeline: only re-validate the Rust shell on main,
        # or on a PR explicitly labelled `mobile`.
        if: >-
            github.event_name == 'push' ||
            contains(github.event.pull_request.labels.*.name, 'mobile')
        runs-on: ${{ matrix.os }}
        timeout-minutes: 45
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, macos-latest]
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
              with:
                  bun-version: ${{ env.BUN_VERSION }}

            - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
              with:
                  toolchain: stable

            - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
              with:
                  workspaces: apps/mobile/src-tauri -> target

            - name: Install the Linux WebKit toolchain
              if: matrix.os == 'ubuntu-latest'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y --no-install-recommends \
                    libwebkit2gtk-4.1-dev \
                    libssl-dev \
                    libgtk-3-dev \
                    libayatana-appindicator3-dev \
                    librsvg2-dev \
                    patchelf

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Tauri build (unsigned)
              working-directory: apps/mobile
              run: bunx @tauri-apps/cli build

    dependency-review:
        name: Dependency review
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read
            pull-requests: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
              with:
                  fail-on-severity: high
                  comment-summary-in-pr: on-failure

    secret-scan:
        name: Secret scan
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
            - name: gitleaks detect
              # The gitleaks marketplace action requires a paid licence for
              # org-owned repos; the upstream binary is Apache-2.0 and does not.
              env:
                  GITLEAKS_VERSION: 8.30.1
              run: |
                  set -euo pipefail
                  curl -fsSL -o /tmp/gitleaks.tar.gz \
                    "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
                  tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
                  /tmp/gitleaks git . --redact --verbose --exit-code 1

    actionlint:
        name: actionlint
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - name: actionlint
              env:
                  ACTIONLINT_VERSION: 1.7.7
              run: |
                  set -euo pipefail
                  curl -fsSL -o /tmp/actionlint.tar.gz \
                    "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
                  tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
                  /tmp/actionlint -color
