name: Release Android

on:
    push:
        tags: ['vision-v*']
    workflow_dispatch:
        inputs:
            tag:
                description: 'Version to publish (e.g. vision-v0.4.2)'
                type: string
                required: true

permissions:
    contents: write

concurrency:
    group: release-android-${{ github.ref }}
    cancel-in-progress: false

env:
    BUN_VERSION: '1.3.14'
    NEXT_TELEMETRY_DISABLED: '1'
    API_BASE_URL: 'https://api.lumiris.eu'
    ASSET_NAME: 'lumiris-vision.apk'

jobs:
    apk:
        name: Build, sign & attach APK
        runs-on: ubuntu-latest
        timeout-minutes: 45
        steps:
            - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

            - id: ident
              env:
                  DISPATCH_TAG: ${{ inputs.tag }}
              run: |
                  set -euo pipefail
                  if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
                    TAG="${DISPATCH_TAG}"
                  else
                    TAG="${GITHUB_REF_NAME}"
                  fi
                  if [[ ! "${TAG}" =~ ^vision-v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
                    echo "::error::'${TAG}' is not a vision-vMAJOR.MINOR.PATCH tag."
                    exit 1
                  fi
                  echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
              with:
                  bun-version: ${{ env.BUN_VERSION }}

            - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
              with:
                  targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

            - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
              with:
                  workspaces: apps/mobile/src-tauri -> target

            - run: bun install --frozen-lockfile

            # Le runner fournit le SDK et le NDK ; on résout la version installée plutôt que de la figer.
            - id: ndk
              run: |
                  set -euo pipefail
                  NDK_DIR="$(find "${ANDROID_HOME}/ndk" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)"
                  if [[ -z "${NDK_DIR}" ]]; then
                    echo "::error::No Android NDK found under ${ANDROID_HOME}/ndk."
                    exit 1
                  fi
                  echo "home=${NDK_DIR}" >> "$GITHUB_OUTPUT"

            - name: Write signing key
              env:
                  KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
                  KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
                  KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
              run: |
                  set -euo pipefail
                  if [[ -z "${KEYSTORE_BASE64}" || -z "${KEYSTORE_PASSWORD}" || -z "${KEY_ALIAS}" ]]; then
                    echo "::error::Missing ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS."
                    exit 1
                  fi
                  GEN_DIR="apps/mobile/src-tauri/gen/android"
                  echo "${KEYSTORE_BASE64}" | base64 -d > "${GEN_DIR}/release.jks"
                  cat > "${GEN_DIR}/keystore.properties" <<EOF
                  storeFile=release.jks
                  storePassword=${KEYSTORE_PASSWORD}
                  keyAlias=${KEY_ALIAS}
                  keyPassword=${KEYSTORE_PASSWORD}
                  EOF

            - name: Build APK
              env:
                  NEXT_PUBLIC_API_BASE_URL: ${{ env.API_BASE_URL }}
                  NDK_HOME: ${{ steps.ndk.outputs.home }}
                  ANDROID_NDK_HOME: ${{ steps.ndk.outputs.home }}
              working-directory: apps/mobile
              run: bun x @tauri-apps/cli@latest android build --apk

            - name: Collect the signed APK
              id: apk
              run: |
                  set -euo pipefail
                  OUT="apps/mobile/src-tauri/gen/android/app/build/outputs/apk/universal/release"
                  APK="$(find "${OUT}" -name '*.apk' ! -name '*unsigned*' | head -1)"
                  if [[ -z "${APK}" ]]; then
                    echo "::error::No signed APK produced — check that keystore.properties was picked up."
                    find "${OUT}" -name '*.apk' || true
                    exit 1
                  fi
                  cp "${APK}" "${ASSET_NAME}"
                  echo "path=${ASSET_NAME}" >> "$GITHUB_OUTPUT"

            - name: Attach to the GitHub release
              env:
                  GH_TOKEN: ${{ github.token }}
                  TAG: ${{ steps.ident.outputs.tag }}
                  APK_PATH: ${{ steps.apk.outputs.path }}
              run: |
                  set -euo pipefail
                  if gh release view "${TAG}" >/dev/null 2>&1; then
                    gh release upload "${TAG}" "${APK_PATH}" --clobber
                  else
                    gh release create "${TAG}" "${APK_PATH}" \
                      --title "Lumiris Vision ${TAG#vision-}" \
                      --notes "APK Android signé. Installation : https://lumiris.eu/telecharger"
                  fi

            - name: Wipe the signing material
              if: always()
              run: |
                  set -euo pipefail
                  rm -f apps/mobile/src-tauri/gen/android/release.jks \
                        apps/mobile/src-tauri/gen/android/keystore.properties
